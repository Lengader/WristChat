name: WristChat
options:
  deploymentTarget:
    iOS: "18.0"
    watchOS: "11.0"
settings:
  base:
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "3"
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: YES
targets:
  WristChat:
    type: application
    platform: iOS
    sources: [Phone, Shared]
    info:
      path: build/PhoneInfo.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLSchemes: [wristchat-auth]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: dev.wristchat.personal
      TARGETED_DEVICE_FAMILY: "1"
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
  WristChatWatch:
    type: application
    platform: watchOS
    sources: [Watch, Shared]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: dev.wristchat.personal.watchkitapp
      INFOPLIST_KEY_CFBundleDisplayName: WristChat
      INFOPLIST_KEY_WKApplication: YES
      INFOPLIST_KEY_WKCompanionAppBundleIdentifier: dev.wristchat.personal
      INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: YES
schemes:
  WristChat:
    build:
      targets:
        WristChat: all
  WristChatWatch:
    build:
      targets:
        WristChatWatch: all
