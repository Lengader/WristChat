name: Build test IPA

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Generate Xcode project
        run: |
          xcodebuild -version
          brew install xcodegen
          xcodegen generate
      - name: Check history, reasoning preferences, and math display
        run: |
          mkdir -p build
          swiftc Shared/ChatBook.swift Shared/MathText.swift Checks/ChatChecks.swift -o build/chat-checks
          build/chat-checks
      - name: Build and package device apps
        run: |
          set -euo pipefail
          xcodebuild -project WristChat.xcodeproj -scheme WristChat \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath build/phone -clonedSourcePackagesDirPath build/packages CODE_SIGNING_ALLOWED=NO build
          xcodebuild -project WristChat.xcodeproj -scheme WristChatWatch \
            -configuration Release -destination 'generic/platform=watchOS' \
            -derivedDataPath build/watch -clonedSourcePackagesDirPath build/packages CODE_SIGNING_ALLOWED=NO build

          mkdir -p build/package/Payload
          phone='build/package/Payload/WristChat.app'
          watch="$phone/Watch/WristChatWatch.app"
          ditto build/phone/Build/Products/Release-iphoneos/WristChat.app "$phone"
          # iLoader Watch Companion discovers watchOS apps in this directory.
          mkdir -p "$phone/Watch"
          ditto build/watch/Build/Products/Release-watchos/WristChatWatch.app "$watch"

          phone_id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$phone/Info.plist")
          watch_companion=$(/usr/libexec/PlistBuddy -c 'Print :WKCompanionAppBundleIdentifier' "$watch/Info.plist")
          test "$phone_id" = "$watch_companion"
          test "$(/usr/libexec/PlistBuddy -c 'Print :WKApplication' "$watch/Info.plist")" = true
          test -x "$phone/WristChat"
          test -x "$watch/WristChatWatch"
          for app in "$phone" "$watch"; do
            test -f "$app/SwaTex_SwaTexRender.bundle/Fonts/KaTeX_Main-Regular.ttf"
            mkdir -p "$app/Licenses/SwaTex"
            cp build/packages/checkouts/SwaTex/{LICENSE,THIRD_PARTY_NOTICES.md} "$app/Licenses/SwaTex/"
            if [[ "$GITHUB_REF_TYPE" == tag ]]; then
              version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Info.plist")
              test "v$version" = "$GITHUB_REF_NAME"
            fi
          done
          ditto -c -k --keepParent build/package/Payload build/WristChat-unsigned.ipa
          unzip -tq build/WristChat-unsigned.ipa
      - name: Check native LaTeX layout for nested expressions
        run: |
          set -euo pipefail
          printf '%s\n' \
            '\sqrt[3]{1+\frac{\sqrt{x+1}}{1+\frac{a}{b}}}' \
            'f(-1)=1+b^2+k(b-1)>0,\qquad f(b)=2b^2-k(b^2+1)<0' \
            '\begin{aligned} a^2+b^2 &= k(ab+1) \\ k &= \frac{a^2+b^2}{ab+1}\end{aligned}' \
            '\begin{pmatrix} a & b \\ c & d \end{pmatrix}' \
            | swift run --package-path build/packages/checkouts/SwaTex --scratch-path build/math-layout LayoutDump \
            | jq -es 'length == 4 and all(.[]; (.displayList.itemCount // 0) > 5 and .displayList.height > 0 and .displayList.depth > 0)'
      - uses: actions/upload-artifact@v4
        with:
          name: WristChat-unsigned
          path: build/WristChat-unsigned.ipa
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    concurrency: release-${{ github.ref }}
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: WristChat-unsigned
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=${GITHUB_REF_NAME#v}
          asset="WristChat-$version-unsigned.ipa"
          mv WristChat-unsigned.ipa "$asset"
          if assets=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'); then
            if ! grep -Fxq "$asset" <<< "$assets"; then
              gh release upload "$GITHUB_REF_NAME" "$asset" --repo "$GITHUB_REPOSITORY"
            fi
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" "$asset" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "WristChat $version" --generate-notes \
            --notes 'В релизе находится неподписанный IPA для iPhone и Apple Watch. Подпиши и установи его через WatchBridge.'
